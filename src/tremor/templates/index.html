<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TREMOR — Unit Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #111417;
    --card-bg: #1b1f24;
    --card-border: #2a2f36;
    --text: #e8eaed;
    --muted: #8a919b;
    --accent: #4da3ff;
    --accent-rocof: #ff9f4d;
    --offline: #4a4f57;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0 0 4px 0;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 20px 0;
  }
  .status-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }
  .status-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.8rem;
  }
  .status-chip .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--offline);
    flex: none;
  }
  .status-chip.live .dot { background: #4dd68a; }
  .status-chip.stale .dot { background: var(--accent-rocof); }
  .status-chip .chip-label {
    font-weight: 600;
  }
  .status-chip .chip-detail {
    color: var(--muted);
  }
  .status-chip .gps-chip {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .status-chip .gps-chip.locked {
    background: rgba(77, 214, 138, 0.15);
    color: #4dd68a;
  }
  .status-chip .gps-chip.unlocked {
    background: rgba(255, 159, 77, 0.15);
    color: var(--accent-rocof);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 20px;
  }
  .card.offline, .card.stale {
    opacity: 0.55;
  }
  .stale-banner {
    background: rgba(255, 159, 77, 0.12);
    border: 1px solid rgba(255, 159, 77, 0.35);
    color: var(--accent-rocof);
    font-size: 0.8rem;
    border-radius: 6px;
    padding: 6px 10px;
    margin-bottom: 10px;
  }
  .completeness {
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 8px;
  }
  .rocof-suppressed {
    color: var(--accent-rocof);
    font-size: 0.75rem;
    margin-top: 4px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .label {
    font-weight: 600;
    font-size: 1rem;
  }
  .status {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .status.live { color: #4dd68a; }
  .readings {
    display: flex;
    gap: 20px;
    margin-bottom: 10px;
  }
  .reading .value {
    font-size: 1.6rem;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .reading .unit {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .reading.freq .value { color: var(--accent); }
  .reading.rocof .value { color: var(--accent-rocof); }
  .chart-container {
    position: relative;
    width: 100%;
    height: 360px;
  }
  .no-data {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 20px 0;
    text-align: center;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <h1>TREMOR — Unit Dashboard</h1>
  <p class="subtitle">Frequency and RoCoF per unit · live feed · polling every 1s</p>
  <div class="status-strip" id="statusStrip"></div>
  <div class="grid" id="grid"></div>

<script>
const POLL_MS = 1000;
const grid = document.getElementById('grid');
const cardsById = {};
const chartsById = {};

// Dark-theme defaults for every chart on the page, set once -- Chart.js's
// own defaults are dark text/gridlines, invisible against this page's
// dark background otherwise.
Chart.defaults.color = '#8a919b';       // matches --muted
Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.08)'; // light, subtle gridlines

// Optional gap shading (Part 2) as a small inline plugin rather than an
// extra CDN library -- Chart.js's own plugin API already covers this, and
// the fewer external scripts a page loads, the faster it loads.
const gapShadingPlugin = {
  id: 'gapShading',
  beforeDraw(chart) {
    const gaps = chart.config.options.plugins.gapShading?.gaps || [];
    if (!gaps.length) return;
    const { ctx, chartArea, scales } = chart;
    if (!chartArea) return;
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    for (const [x0, x1] of gaps) {
      const left = scales.x.getPixelForValue(x0);
      const right = scales.x.getPixelForValue(x1);
      ctx.fillRect(left, chartArea.top, right - left, chartArea.bottom - chartArea.top);
    }
    ctx.restore();
  },
};
Chart.register(gapShadingPlugin);

// GAP_THRESHOLD_S's frontend twin: the server is the single source of
// truth for WHICH spans count as gaps (see unit.gaps/rocof_gaps below),
// this is only used to insert the actual line-break point a hair inside
// a detected gap's start.
const GAP_BREAK_EPSILON_S = 1e-3;

function makeCard(unit) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-header">
      <span class="label"></span>
      <span class="status"></span>
    </div>
    <div class="stale-banner" hidden></div>
    <div class="readings">
      <div class="reading freq">
        <div class="value">--</div>
        <div class="unit">Hz</div>
      </div>
      <div class="reading rocof">
        <div class="value">--</div>
        <div class="unit">Hz/s</div>
      </div>
    </div>
    <div class="chart-container"><canvas></canvas></div>
    <div class="completeness"></div>
    <div class="rocof-suppressed" hidden></div>
    <div class="no-data" hidden>No data yet</div>
  `;
  grid.appendChild(card);

  const canvas = card.querySelector('canvas');
  chartsById[unit.id] = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      datasets: [
        {
          label: 'Frequency (Hz)',
          data: [],
          borderColor: '#4da3ff',        // matches --accent
          backgroundColor: '#4da3ff',
          yAxisID: 'yFreq',
          pointRadius: 0,
          borderWidth: 1.5,
          spanGaps: false,               // Part 2: break the line, don't join across a gap
        },
        {
          label: 'RoCoF (Hz/s)',
          data: [],
          borderColor: '#ff9f4d',        // matches --accent-rocof
          backgroundColor: '#ff9f4d',
          yAxisID: 'yRocof',
          pointRadius: 0,
          borderWidth: 1.5,
          spanGaps: false,
        },
        {
          label: '',                     // hidden from the legend (see filter below)
          data: [],
          borderColor: '#3a4048',
          borderDash: [4, 4],
          borderWidth: 1,
          pointRadius: 0,
          yAxisID: 'yFreq',
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,                  // avoid jank re-animating on every 1s poll
      parsing: false,                    // data points are already {x, y}
      interaction: { mode: 'nearest', intersect: false },
      plugins: {
        legend: {
          labels: { filter: (item) => item.text !== '' },
        },
        gapShading: { gaps: [] },  // populated per-poll in updateChart
      },
      scales: {
        x: {
          type: 'linear',
          title: { display: true, text: 'Seconds ago' },
        },
        yFreq: {
          type: 'linear',
          position: 'left',
          title: { display: true, text: 'Frequency (Hz)' },
        },
        yRocof: {
          type: 'linear',
          position: 'right',
          title: { display: true, text: 'RoCoF (Hz/s)' },
          grid: { drawOnChartArea: false }, // avoid two overlapping gridlines
        },
      },
    },
  });

  return card;
}

// Builds a Chart.js dataset array from (t, value) points plus the
// server's own [start_t, end_t] gap list (see webapp.py's _find_gaps):
// a null-y point is inserted just inside each gap's start so the line
// breaks there (spanGaps: false on the dataset) instead of drawing a
// straight, misleading connector across missing data -- exactly the
// "bursts joined by connectors" look the original RoCoF bug produced.
function buildGappedSeries(points, gaps, latestT) {
  const gapStarts = new Set(gaps.map(([start]) => start));
  const data = [];
  for (const [t, value] of points) {
    data.push({ x: t - latestT, y: value });
    if (gapStarts.has(t)) {
      data.push({ x: t - latestT + GAP_BREAK_EPSILON_S, y: null });
    }
  }
  return data;
}

function updateChart(chart, unit) {
  const freqHistory = unit.history || [];
  const rocofHistory = unit.rocof_history || [];
  if (freqHistory.length === 0 && rocofHistory.length === 0) return;

  const latestT = Math.max(
    freqHistory.length ? freqHistory[freqHistory.length - 1][0] : -Infinity,
    rocofHistory.length ? rocofHistory[rocofHistory.length - 1][0] : -Infinity,
  );

  chart.data.datasets[0].data = buildGappedSeries(freqHistory, unit.gaps || [], latestT);
  chart.data.datasets[1].data = buildGappedSeries(rocofHistory, unit.rocof_gaps || [], latestT);

  const xMin = chart.data.datasets[0].data.length ? chart.data.datasets[0].data[0].x : -60;
  chart.data.datasets[2].data = [{ x: xMin, y: 50.0 }, { x: 0, y: 50.0 }]; // 50Hz reference line

  // Shade both series' gaps on the same chart area (frequency's gaps in
  // particular -- RoCoF gaps are usually a subset/superset of those).
  const shadeGaps = (unit.gaps || []).map(([t0, t1]) => [t0 - latestT, t1 - latestT]);
  chart.options.plugins.gapShading.gaps = shadeGaps;

  chart.update('none'); // 'none' = skip animation
}

function updateCard(card, unit) {
  card.querySelector('.label').textContent = unit.label;
  const statusEl = card.querySelector('.status');
  statusEl.textContent = unit.status;
  statusEl.className = 'status ' + unit.status;
  card.classList.toggle('offline', unit.status === 'offline');
  card.classList.toggle('stale', unit.status === 'stale');

  const noData = card.querySelector('.no-data');
  const chartContainer = card.querySelector('.chart-container');
  const readings = card.querySelector('.readings');
  const staleBanner = card.querySelector('.stale-banner');
  const completeness = card.querySelector('.completeness');
  const rocofSuppressed = card.querySelector('.rocof-suppressed');

  if (unit.status === 'offline') {
    noData.hidden = false;
    chartContainer.hidden = true;
    readings.hidden = true;
    staleBanner.hidden = true;
    completeness.textContent = '';
    rocofSuppressed.hidden = true;
    return;
  }
  noData.hidden = true;
  chartContainer.hidden = false;
  readings.hidden = false;

  // "stale" (Part 3): reported before, but not recently -- grey out (see
  // .card.stale) and show a clear message, but keep the last-known
  // chart/readings visible rather than hiding them like "offline" does.
  if (unit.status === 'stale') {
    const ago = Math.round(unit.seconds_since_last_reading);
    staleBanner.textContent = `No update in ${ago}s — showing last known values`;
    staleBanner.hidden = false;
  } else {
    staleBanner.hidden = true;
  }

  card.querySelector('.reading.freq .value').textContent = unit.freq_hz.toFixed(3);
  const rocof = unit.rocof_hz_s;
  card.querySelector('.reading.rocof .value').textContent =
    (rocof >= 0 ? '+' : '') + rocof.toFixed(3);

  if (unit.completeness_pct != null) {
    completeness.textContent =
      `${unit.completeness_pct.toFixed(0)}% data completeness (last 60s, ` +
      `${unit.samples_per_minute} samples/min)`;
  }

  // Separately labelled from completeness -- a suppressed RoCoF point is a
  // point the server refused to compute/plot at all (a batch-boundary
  // refusal or the plausibility backstop), not a matter of raw sample
  // coverage, so it belongs in its own line rather than folded into the
  // completeness text.
  if (unit.rocof_suppressed_count > 0) {
    rocofSuppressed.textContent =
      `${unit.rocof_suppressed_count} RoCoF point` +
      `${unit.rocof_suppressed_count === 1 ? '' : 's'} suppressed (implausible or batch-boundary)`;
    rocofSuppressed.hidden = false;
  } else {
    rocofSuppressed.hidden = true;
  }

  updateChart(chartsById[unit.id], unit);
}

function updateStatusStrip(units) {
  const strip = document.getElementById('statusStrip');
  if (units.length === 0) {
    strip.innerHTML = '<div class="status-chip"><span class="chip-detail">No units yet</span></div>';
    return;
  }
  strip.innerHTML = units.map((unit) => {
    const lastUpdate = unit.seconds_since_last_reading != null
      ? `last update ${Math.round(unit.seconds_since_last_reading)}s ago`
      : 'no data yet';
    // GPS lock is only shown when we actually know something about it --
    // gps_locked is null for a unit that's never reported at all, per the
    // task's "omit rather than fake it" requirement.
    const gpsChip = unit.gps_locked != null
      ? `<span class="gps-chip ${unit.gps_locked ? 'locked' : 'unlocked'}">` +
        `GPS ${unit.gps_locked ? 'locked' : 'no lock'}</span>`
      : '';
    const rate = unit.status !== 'offline' ? `${unit.samples_per_minute} samples/min` : '';
    return `
      <div class="status-chip ${unit.status}">
        <span class="dot"></span>
        <span class="chip-label">${unit.label}</span>
        <span class="chip-detail">${unit.status}</span>
        <span class="chip-detail">${lastUpdate}</span>
        ${gpsChip}
        <span class="chip-detail">${rate}</span>
      </div>
    `;
  }).join('');
}

async function poll() {
  try {
    const res = await fetch('/api/units');
    const units = await res.json();
    updateStatusStrip(units);
    for (const unit of units) {
      if (!cardsById[unit.id]) {
        cardsById[unit.id] = makeCard(unit);
      }
      updateCard(cardsById[unit.id], unit);
    }
  } catch (err) {
    console.error('poll failed', err);
  }
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
